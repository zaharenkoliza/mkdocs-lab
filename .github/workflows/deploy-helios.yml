name: Deploy to Helios

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare deployment variables
        run: |
          BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" \
            | tr '/_' '--' \
            | tr -cd '[:alnum:].-')

          echo "BRANCH_SLUG=$BRANCH_SLUG" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "DEPLOY_PATH=~/public_html/mkdocs-lab" >> "$GITHUB_ENV"
            echo "DEPLOY_URL=https://se.ifmo.ru/~s335141/mkdocs-lab/" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_PATH=~/public_html/mkdocs-lab-previews/$BRANCH_SLUG" >> "$GITHUB_ENV"
            echo "DEPLOY_URL=https://se.ifmo.ru/~s335141/mkdocs-lab-previews/$BRANCH_SLUG/" >> "$GITHUB_ENV"
          fi

      - name: Build site
        run: |
          cp mkdocs-helios.yml mkdocs-ci.yml

          sed -i "s|^site_url:.*|site_url: ${DEPLOY_URL}|" mkdocs-ci.yml

          mkdocs build --strict -f mkdocs-ci.yml

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.HELIOS_SSH_KEY }}" > ~/.ssh/helios_key
          chmod 600 ~/.ssh/helios_key

          ssh-keyscan -H -p 2222 helios.cs.ifmo.ru >> ~/.ssh/known_hosts

      - name: Backup current production
        if: github.ref_name == 'main'
        run: |
          ssh \
            -i ~/.ssh/helios_key \
            -o IdentitiesOnly=yes \
            -p 2222 \
            s335141@helios.cs.ifmo.ru \
            'rm -rf ~/public_html/mkdocs-lab-prev &&
             if [ -d ~/public_html/mkdocs-lab ]; then
               cp -a ~/public_html/mkdocs-lab ~/public_html/mkdocs-lab-prev
             fi'

      - name: Create deployment directory
        run: |
          ssh \
            -i ~/.ssh/helios_key \
            -o IdentitiesOnly=yes \
            -p 2222 \
            s335141@helios.cs.ifmo.ru \
            "mkdir -p ${DEPLOY_PATH}"

      - name: Deploy with rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/helios_key -o IdentitiesOnly=yes -p 2222" \
            site-helios/ \
            "s335141@helios.cs.ifmo.ru:${DEPLOY_PATH}/"

      - name: Healthcheck
        run: |
          echo "Checking ${DEPLOY_URL}"

          HTTP_CODE=$(curl \
            --silent \
            --output /tmp/site.html \
            --write-out "%{http_code}" \
            "${DEPLOY_URL}")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Expected HTTP 200, got ${HTTP_CODE}"
            exit 1
          fi

          if ! grep -q "CONTROL_STRING_STATIC_SITE_2026" /tmp/site.html; then
            echo "Control string not found"
            exit 1
          fi

          echo "Healthcheck successful"